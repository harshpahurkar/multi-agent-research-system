[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-research-system"
version = "0.2.0"
description = "Offline-first LangGraph research workflow with FastAPI jobs, retries, logging, and optional OpenAI/Redis integrations."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.10",
  "langgraph>=0.2.80",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "httpx>=0.27",
]
openai = [
  "openai>=2.8.0",
]
redis = [
  "redis>=5.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -p no:cacheprovider"
markers = [
  "integration: tests that require local Docker services",
]
